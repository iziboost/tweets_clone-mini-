
services:
  postgres:
    image: postgres:16
    container_name: microblog_postgres
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: microblog_api
    restart: always
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - media_data:/app/media
    ports:
      - "8000:8000"

  nginx:
    image: nginx:alpine
    container_name: microblog_nginx
    restart: always
    depends_on:
      - api
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - media_data:/media:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

volumes:
  postgres_data:
  media_data:
